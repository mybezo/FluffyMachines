name: Java CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
      - name: Build with Maven
        run: mvn package --file pom.xml
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: FluffyMachines
          # The shaded plugin jar; skips the "original-*.jar" that maven-shade leaves behind
          path: target/FluffyMachines v*.jar
          if-no-files-found: error
